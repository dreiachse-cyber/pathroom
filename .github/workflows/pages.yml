name: Deploy PATHROOM to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: site
        run: pnpm test

      - name: Generate Batch 006-011 icon visual QA
        id: icon_visual_qa
        continue-on-error: true
        working-directory: site
        run: pnpm qa:icons

      - name: Upload Batch 006-011 icon visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathroom-icon-qa-batches-006-011-${{ github.sha }}
          path: site/artifacts/icon-qa
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Batch 006-011 icon visual QA
        if: steps.icon_visual_qa.outcome != 'success'
        run: exit 1

      - name: Build
        working-directory: site
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build

      - name: Record catalog scale report
        working-directory: site
        run: pnpm report:scale

      - name: Verify packaged site
        working-directory: site
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm test:sites

      - name: Verify Pages base path
        working-directory: site
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm test:pages-base

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
